<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scooby-Doo! Creepy Run (Full Screen)</title>
    <style>
        /* Remove default margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* Make the game container span the entire viewport */
        #flash-game {
            width: 100vw;
            height: 100vh;
            display: block;
            position: relative;
            background: #000;
        }

        /* Mobile controls container */
        .mobile-controls {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none; /* allow children to handle touches only */
        }

        .dpad, .action {
            display: grid;
            pointer-events: auto;
        }

        /* D-pad layout */
        .dpad {
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
            grid-template-columns: 56px 56px 56px;
            grid-template-rows: 56px 56px 56px;
            gap: 8px;
            touch-action: none;
        }

        .dpad button {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad button:active {
            background: rgba(255,255,255,0.16);
        }

        .up { grid-area: up; }
        .down { grid-area: down; }
        .left { grid-area: left; }
        .right { grid-area: right; }

        /* Optional action button (e.g., jump) */
        .action {
            margin-left: 10px;
            grid-template-columns: 64px;
            grid-template-rows: 64px;
        }

        .action button {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            border: none;
            background: rgba(255,69,0,0.12);
            color: #fff;
            font-size: 18px;
        }

        .action button:active {
            background: rgba(255,69,0,0.22);
        }

        /* Hide controls on larger screens */
        @media (min-width: 900px) {
            .mobile-controls { display: none; }
        }
    </style>
</head>
<body>

    <div id="flash-game"></div>

    <!-- On-screen mobile controls -->
    <div class="mobile-controls" aria-hidden="false" id="mobileControls">
        <div class="dpad" role="group" aria-label="directional pad">
            <button class="up" data-key="ArrowUp" aria-label="Up">▲</button>
            <button class="left" data-key="ArrowLeft" aria-label="Left">◄</button>
            <button class="right" data-key="ArrowRight" aria-label="Right">►</button>
            <button class="down" data-key="ArrowDown" aria-label="Down">▼</button>
        </div>
        <div class="action" role="group" aria-label="actions">
            <button id="actionBtn" data-key="Space" aria-label="Action">A</button>
        </div>
    </div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-game");

            container.appendChild(player);

            // Load the SWF file
            player.load("https://swf.gdata1.com/scooby-doo-creepy-run/scooby-doo-creepy-run.swf");

            // Force the player object to fill its container completely
            player.style.width = "100%";
            player.style.height = "100%";

            // Setup mobile controls: translate touch events into keyboard events targeted at the player iframe/object
            const controls = document.getElementById("mobileControls");
            // If Ruffle uses an internal element, dispatch events to the container (player) which should be in focus
            function dispatchKeyEvent(type, key) {
                // create a KeyboardEvent with minimal sensible properties
                const ev = new KeyboardEvent(type, {
                    key: key,
                    code: key,
                    bubbles: true,
                    cancelable: true
                });
                // Try dispatching to the ruffle player element first, fall back to window
                if (player && player.dispatchEvent) {
                    player.dispatchEvent(ev);
                } else {
                    window.dispatchEvent(ev);
                }
            }

            // Helper to bind touch + mouse for a button element
            function bindControl(btn, keyName) {
                let active = false;
                const start = (e) => {
                    e.preventDefault();
                    if (active) return;
                    active = true;
                    dispatchKeyEvent("keydown", keyName);
                };
                const end = (e) => {
                    e.preventDefault();
                    if (!active) return;
                    active = false;
                    dispatchKeyEvent("keyup", keyName);
                };
                btn.addEventListener("touchstart", start, { passive: false });
                btn.addEventListener("touchend", end);
                btn.addEventListener("touchcancel", end);
                btn.addEventListener("mousedown", start);
                document.addEventListener("mouseup", end);
                // support leaving button area
                btn.addEventListener("mouseleave", end);
            }

            // Attach to each control button
            const buttons = controls.querySelectorAll("button[data-key]");
            buttons.forEach(b => {
                const key = b.getAttribute("data-key");
                bindControl(b, key);
            });

            // Ensure the player keeps focus for keyboard events on desktop
            player.tabIndex = -1;
            player.addEventListener("click", () => player.focus());
        });
    </script>

</body>
</html>
